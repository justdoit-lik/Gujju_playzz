<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gujju Playzz</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
/* Menu Container */
.menu-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

/* Hamburger Button */
.menu-btn {
    width: 40px;
    height: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
}

.menu-btn span {
    height: 5px;
    width: 100%;
    background: #ff6600;
    border-radius: 5px;
    transition: 0.4s;
    box-shadow: 0 0 10px #ff6600;
}

/* Animate to X */
.menu-btn.active span:nth-child(1) {
    transform: rotate(45deg) translate(6px, 6px);
}

.menu-btn.active span:nth-child(2) {
    opacity: 0;
}

.menu-btn.active span:nth-child(3) {
    transform: rotate(-45deg) translate(7px, -7px);
}

/* Menu Items */
.menu-items {
    position: absolute;
    top: 50px;
    right: 0;
    background: black;
    border: 2px solid #ff6600;
    padding: 20px;
    border-radius: 10px;
    display: none;
    flex-direction: column;
    animation: crazyDrop 0.5s ease forwards;
}

.menu-items a {
    color: #ff6600;
    text-decoration: none;
    margin: 10px 0;
    font-weight: bold;
    transition: 0.3s;
}

.menu-items a:hover {
    color: white;
    text-shadow: 0 0 10px #ff6600;
}

/* Crazy drop animation */
@keyframes crazyDrop {
    0% {
        opacity: 0;
        transform: translateY(-20px) scale(0.8);
    }
    50% {
        transform: translateY(10px) scale(1.1);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #000000, #ff6600);
        color: white;
        text-align: center;
    }

    .container {
        padding: 80px 20px;
    }

    /* Logo Style */
.logo {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #ff6600;
    box-shadow: 0 0 25px #ff6600;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
}

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    h1 {
        font-family: 'Creepster', cursive;
        font-size: 80px;
        color: #F5F5DC;
        text-shadow: 
            0 0 10px #ff0000,
            0 0 20px #990000,
            0 0 40px #ff3300;
        letter-spacing: 5px;
        margin-bottom: 20px;
        animation: glow 2s infinite alternate;
    }

    p {
        font-size: 20px;
        margin-bottom: 40px;
    }

    .btn {
        display: inline-block;
        padding: 15px 30px;
        margin: 10px;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 30px;
        transition: 0.3s;
    }

    .youtube {
        background-color: #ff0000;
        color: white;
    }

    .instagram {
        background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
        color: white;
    }

    .btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px #ff6600;
    }

    footer {
        margin-top: 80px;
        padding: 20px;
        background-color: black;
        font-size: 14px;
    }
</style>
</head>

<body>
  <!-- MENU BUTTON -->
<div class="menu-container">
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="menu-items" id="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</div>

<div class="container">

    <!-- Add Your Logo Here -->
    <img src="logo.png" alt="Gujju Playzz Logo" class="logo">

    <h1>Gujju Playzz</h1>
    <p>Enter the Ultimate Gaming Battlefield 🔥</p>

    <a href="https://youtube.com/@gujjuplayzz1?si=wpKY15sN9ljmhpYU" target="_blank" class="btn youtube">
        YouTube Channel
    </a>

    <a href="https://www.instagram.com/gujju_playzz?igsh=MTFyd3MycmVvYWRkbw==" target="_blank" class="btn instagram">
        Instagram Page
    </a>

</div>

<footer>
    © 2026 Gujju Playzz | All Rights Reserved
</footer>
<script>
function toggleMenu() {
    const btn = document.querySelector(".menu-btn");
    const menu = document.getElementById("menu");

    btn.classList.toggle("active");

    if (menu.style.display === "flex") {
        menu.style.display = "none";
    } else {
        menu.style.display = "flex";
    }
}
</script>
</body>
</html>
